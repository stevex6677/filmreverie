name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Finish the Worker/Pages pair before starting another production deployment.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Build the website
        run: npm run build
      - name: Run integration tests
        run: npm run test:integration
      - name: Validate the Worker bundle
        run: npm run check:cloud
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the CLOUDFLARE_API_TOKEN repository secret before deploying.'
            exit 1
          fi
      - name: Validate private production configuration
        env:
          CLOUDFLARE_DEPLOYMENT_CONFIG: ${{ secrets.CLOUDFLARE_DEPLOYMENT_CONFIG }}
        run: npm run check:cloud:production
      - name: Deploy the API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEPLOYMENT_CONFIG: ${{ secrets.CLOUDFLARE_DEPLOYMENT_CONFIG }}
        run: npm run deploy:worker
      - name: Deploy the production website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEPLOYMENT_CONFIG: ${{ secrets.CLOUDFLARE_DEPLOYMENT_CONFIG }}
        run: npm run deploy:pages
      - name: Check the website and public gallery endpoint
        env:
          CLOUDFLARE_DEPLOYMENT_CONFIG: ${{ secrets.CLOUDFLARE_DEPLOYMENT_CONFIG }}
        run: npm run verify:cloud
      - name: Record the production deployment
        run: |
          {
            echo 'Deployed the API Worker and Pages website using the private production configuration.'
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
