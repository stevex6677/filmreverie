name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Finish the Worker/Pages pair before starting another production deployment.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: '073b00cf250298d0cec5135a0a3a2b25'
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Build the website
        run: npm run build
      - name: Run integration tests
        run: npm run test:integration
      - name: Validate the Worker bundle
        run: npm run check:cloud
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the CLOUDFLARE_API_TOKEN repository secret before deploying.'
            exit 1
          fi
      - name: Deploy the API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config cloudflare/wrangler.jsonc
      - name: Deploy the production website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Pages was created with production branch main; GitHub uses master.
        run: npx wrangler pages deploy dist --project-name filmreverie --branch main --commit-hash "$GITHUB_SHA"
      - name: Check the public gallery endpoint
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://filmreverie.app/api/gallery', { signal: AbortSignal.timeout(30000) });
          if (!response.ok) throw new Error(`Public gallery check failed (${response.status}).`);
          const catalog = await response.json();
          if (catalog.version !== 1 || !Array.isArray(catalog.rolls)) throw new Error('Unexpected public gallery response.');
          console.log('Public gallery API is available.');
          JS
      - name: Record the production deployment
        run: |
          {
            echo 'Deployed the API Worker and Pages website to https://filmreverie.app.'
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
